services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      CYBER_SENTINEL_DB: /data/security.db
    volumes:
      - cyber_sentinel_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [internal]

volumes:
  cyber_sentinel_data:

networks:
  internal:
    driver: bridge
